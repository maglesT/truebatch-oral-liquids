<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="1024" height="1024">
<title>TrueBatch mark</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dd1a10"/><stop offset=".55" stop-color="#f4511e"/><stop offset="1" stop-color="#f7941d"/>
    </linearGradient></defs>
      <!-- rounded square in the Medhanta gradient -->
      <rect x="10" y="40" width="200" height="200" rx="54" fill="url(#g)"/>
      <!-- T: the crossbar is a two-tone tablet capsule -->
      <path d="M68 82 h42 v40 h-42 a20 20 0 0 1 0 -40 z" fill="#ffffff"/>
      <path d="M110 82 h42 a20 20 0 0 1 0 40 h-42 z" fill="#ffffff" opacity=".72"/>
      <rect x="93" y="118" width="34" height="88" rx="17" fill="#ffffff"/>
      <!-- verified badge: the record is right -->
      <circle cx="196" cy="214" r="38" fill="#ffffff" stroke="#f4511e" stroke-width="7"/>
      <path d="M177 214 l13 13 l25 -27" stroke="#f4511e" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- data squares, as in the Medhanta mark, clear of the shape -->
