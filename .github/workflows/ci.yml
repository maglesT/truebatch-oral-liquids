name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: truebatch_owner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: truebatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U truebatch_owner" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://truebatch_owner:dev@localhost:5432/truebatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Every TrueBatch rule has tests (docs/rules.md).
      - run: npm run traceability -- --check
  # Browser journeys against the built UI and the real server.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: truebatch_owner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: truebatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U truebatch_owner" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://truebatch_owner:dev@localhost:5432/truebatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
